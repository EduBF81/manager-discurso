name: CI/CD - Deploy Manager Discurso

on:
  push:
    branches: [main] # Sempre que houver push na main, o deploy acontece

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Instalar Node.js e Dependências ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build do Projeto (Vite) 🏗️
        run: |
          npm ci
          npm run build

      - name: Deploy para GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
