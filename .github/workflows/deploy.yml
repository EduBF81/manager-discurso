name: CI/CD - Deploy Manager Discurso

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Instalar Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Limpar e Instalar Dependências 📦
        # O comando 'npm install' no Linux vai detetar que precisa do binário gnu-x64
        # Adicionamos a flag --include=dev para garantir que o Vite e Tailwind funcionam
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=dev

      - name: Build do Projeto (Vite) 🏗️
        run: npm run build

      - name: Deploy para GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true