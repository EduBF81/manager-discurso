name: CI/CD - Deploy Manager Discurso

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Instalar Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências 📦
        # Usamos install em vez de ci para maior compatibilidade inicial
        run: npm install

      - name: Build do Projeto (Vite) 🏗️
        # Adicionamos o comando para gerar os ficheiros de produção
        run: npm run build

      - name: Deploy para GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true